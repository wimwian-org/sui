name: Guard master
on:
  pull_request:
    branches: [master]

jobs:
  check-source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Enforce release/hotfix prefix
        run: |
          branch="${{ github.head_ref }}"
          if [[ "$branch" =~ ^(release|hotfix)/ ]]; then
            echo "Branch '$branch' is allowed."
          else
            echo "::error::PRs to master must come from release/* or hotfix/* branches. Got: $branch"
            exit 1
          fi
